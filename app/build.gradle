plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.korokoroyok.karaoke'
    compileSdk 34

    defaultConfig {
        applicationId "com.korokoroyok.karaoke"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0-KoroKoroYok-F999Max-ModeA"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.leanback:leanback:1.0.0'
    implementation 'androidx.media3:media3-exoplayer:1.2.1'
    implementation 'androidx.media3:media3-ui:1.2.1'
    implementation 'com.github.TeamNewPipe:NewPipeExtractor:v0.22.10'
    implementation 'com.github.TeamNewPipe:nanojson:e9d656d226'
}
